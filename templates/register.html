<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Student Registration</title><link rel="stylesheet" href="{{ url_for('static', path='style.css') }}"></head>
<body><main class="container"><section class="profile-card auth-card">
<h1>Student Registration</h1><p class="subtitle">Create your student account</p>
{% if error %}<p class="auth-error">{{ error }}</p>{% endif %}
<form action="/register" method="post">
<label for="name">Full name</label><input id="name" name="name" required maxlength="100">
<label for="age">Age</label><input id="age" type="number" name="age" min="1" max="120" required>
<label for="city">City</label><input id="city" name="city" required>
<label for="email">Email</label><input id="email" type="email" name="email" required autocomplete="username">
<label for="course">Course</label><input id="course" name="course" required>
<label for="bio">About you</label><textarea id="bio" name="bio" rows="3"></textarea>
<label for="password">Password (at least 8 characters)</label><input id="password" type="password" name="password" minlength="8" required autocomplete="new-password">
<label for="confirm_password">Confirm password</label><input id="confirm_password" type="password" name="confirm_password" minlength="8" required autocomplete="new-password">
<button class="back-button" type="submit">Create Student Account</button></form>
<p>Already registered? <a href="/login">Log in</a></p></section></main></body></html>
