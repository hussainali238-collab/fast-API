
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Student</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="container">
              <div class="profile-card">

<h1>Edit Student</h1>  
<form action="/update-student/{{ student.id }}" method="post">
       <label for="name">Name</label>
       <input id="name" type="text" name="name"
              value="{{ student.name }}" required>  
       <label for="age">Age</label>
       <input id="age" type="number" name="age"
              value="{{ student.age }}" required>  
       <label for="city">City</label>
       <input id="city" type="text" name="city"
              value="{{ student.city }}" required>  
       <label for="email">Email</label>
       <input id="email" type="email" name="email"
              value="{{ student.email }}" required>  
       <label for="course">Course</label>
       <input id="course" type="text" name="course"
              value="{{ student.course }}" required>  
       <label for="bio">Bio</label>
       <textarea id="bio" name="bio" required>{{ student.bio }}</textarea>  
       <button type="submit" class="back-button">Save Changes</button>
              </form>
              </div>
       </main>
</body>
</html>
