<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Edit Student</title><link rel="stylesheet" href="{{ url_for('static', path='style.css') }}"></head>
<body><main class="container"><section class="profile-card"><h1>Edit Student Profile</h1>
<form action="{{ form_action }}" method="post"><label for="name">Name</label><input id="name" name="name" value="{{ student.name }}" required>
<label for="age">Age</label><input id="age" type="number" name="age" min="1" max="120" value="{{ student.age }}" required>
<label for="city">City</label><input id="city" name="city" value="{{ student.city }}" required>
<label for="email">Email</label><input id="email" type="email" name="email" value="{{ student.email }}" required>
<label for="course">Course</label><input id="course" name="course" value="{{ student.course }}" required>
<label for="bio">About</label><textarea id="bio" name="bio" rows="4">{{ student.bio }}</textarea>
<button class="back-button" type="submit">Save Changes</button></form><a class="back-button" href="/">Cancel</a></section></main></body></html>
